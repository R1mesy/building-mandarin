<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級加分板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 黑板綠頁首 + 明亮教室紙面；分數用向日葵黃，加分綠、扣分珊瑚紅 */
  --board:#1f4a40;
  --board-ink:#eaf3ee;
  --paper:#f2f5f3;
  --card:#ffffff;
  --ink:#1d2a26;
  --muted:#5e6d68;
  --line:#dbe3df;
  --sun:#f6b81c;
  --good:#2a9a58;
  --good-soft:#e3f5ea;
  --bad:#dd5b3c;
  --bad-soft:#fdeae4;
  --font-display:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header{background:var(--board);color:var(--board-ink);padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.title{display:flex;align-items:center;gap:10px;min-width:0}
.title h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.title .sub{font-size:13px;opacity:.75}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 14px;text-align:center;min-width:84px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.8}
.stat.total b{color:var(--sun)}
.stat.g b{color:#8fe0ad}
.stat.r b{color:#ffb39f}
.spacer{flex:1}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:rgba(255,255,255,.14);color:var(--board-ink)}
.hbtn:hover{background:rgba(255,255,255,.24)}
.hbtn.primary{background:var(--sun);color:#3a2a00}
.hbtn.primary:hover{filter:brightness(1.05)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px 0}
.toolbar label{font-size:14px;color:var(--muted)}
.toolbar select{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:500}
.tbtn:hover{border-color:var(--muted)}
.sync{font-size:13px;color:var(--muted);margin-left:auto}

.notice{margin:12px 20px 0;padding:10px 14px;border-radius:12px;background:#fff7dc;border:1px solid #f1df9e;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.notice button{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px}

main{padding:16px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.stu{position:relative;background:var(--card);border:2px solid transparent;border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(31,74,64,.06);transition:transform .12s,border-color .2s}
.stu:hover{transform:translateY(-2px);border-color:var(--line)}
.stu.flash-good{animation:fg 1s}
.stu.flash-bad{animation:fb 1s}
.stu.picked{border-color:var(--sun);box-shadow:0 0 0 4px rgba(246,184,28,.35)}
@keyframes fg{0%{border-color:var(--good);background:var(--good-soft)}100%{border-color:transparent;background:var(--card)}}
@keyframes fb{0%{border-color:var(--bad);background:var(--bad-soft)}100%{border-color:transparent;background:var(--card)}}
.stu .av{width:78px;height:78px}
.stu .nm{font-weight:700;font-size:18px;text-align:center;word-break:break-all;line-height:1.3}
.stu .seat{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted);font-family:var(--font-display)}
.pts{position:absolute;top:8px;right:8px;min-width:34px;height:34px;padding:0 8px;border-radius:17px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;background:#eef1f0;color:var(--muted);font-variant-numeric:tabular-nums}
.pts.pos{background:var(--good);color:#fff}
.pts.neg{background:var(--bad);color:#fff}
.mini{width:24px;height:24px;flex:none}
.smiles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;min-height:26px;max-width:140px}
.smiles .none{font-size:12px;color:var(--muted)}
.times{font-family:var(--font-display);font-weight:700;font-size:18px;margin-left:2px}
.times.g{color:var(--good)} .times.r{color:var(--bad)}
.bigpts{display:flex;flex-wrap:wrap;gap:3px;max-width:220px;justify-content:flex-end}
.bigpts .mini{width:24px;height:24px}
.bigpts .none{font-size:14px;color:var(--muted)}
.bbtn .v{display:flex;gap:3px;min-height:26px;align-items:center}
.bbtn .v .mini{width:24px;height:24px}
.burst .what{display:flex;align-items:center;gap:14px}
.burst .what .v{display:flex;gap:4px}
.burst .what .mini{width:clamp(28px,4vw,40px);height:clamp(28px,4vw,40px)}
.apicks{display:flex;flex-wrap:wrap;gap:8px}
.apick{width:52px;height:52px;padding:2px;border:3px solid transparent;border-radius:50%;background:none}
.apick:hover{border-color:var(--line)}
.apick.on{border-color:var(--sun)}
.addcard{border:2px dashed var(--line);background:transparent;box-shadow:none;color:var(--muted);justify-content:center;min-height:150px;font-weight:700}
.addcard:hover{border-color:var(--muted);color:var(--ink)}
.addcard .plus{font-family:var(--font-display);font-size:40px;line-height:1}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(18,32,28,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim.open{display:flex}
.dlg{background:var(--card);border-radius:20px;width:min(720px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg-h{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:22px}
.dlg-h .x{margin-left:auto;border:0;background:#eef1f0;border-radius:50%;width:38px;height:38px;font-size:20px;line-height:1}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.dlg-h .av{width:64px;height:64px;flex:none}
.nameedit{border:1px solid transparent;border-radius:8px;padding:2px 6px;font-size:22px;font-weight:900;width:100%;min-width:0;background:transparent}
.nameedit:hover,.nameedit:focus{border-color:var(--line);background:#f8faf9}
.bigpts{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:700;font-size:17px}
.tab.on.g{border-color:var(--good);background:var(--good-soft);color:#17663a}
.tab.on.r{border-color:var(--bad);background:var(--bad-soft);color:#9b3016}
.beh{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:16px;transition:transform .1s}
.bbtn:hover{transform:translateY(-2px)}
.bbtn .v{font-family:var(--font-display);font-size:24px}
.bbtn.g .v{color:var(--good)}
.bbtn.r .v{color:var(--bad)}
.bbtn.g:hover{border-color:var(--good);background:var(--good-soft)}
.bbtn.r:hover{border-color:var(--bad);background:var(--bad-soft)}
.sec h3{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:700}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.log li{display:flex;gap:10px;align-items:center;font-size:14px;padding:4px 8px;border-radius:8px;background:#f6f8f7}
.log .lv{font-family:var(--font-display);font-weight:700;min-width:30px}
.log .lv.g{color:var(--good)} .log .lv.r{color:var(--bad)}
.log time{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:#eef1f0}
.btn:hover{filter:brightness(.96)}
.btn.dark{background:var(--ink);color:#fff}
.btn.danger{background:var(--bad-soft);color:#9b3016}
.btn.danger.sure{background:var(--bad);color:#fff}
textarea,.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfc}
textarea{min-height:160px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:0}
.brow{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center}
.brow select{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fbfcfc}
.brow .del{border:0;background:#eef1f0;border-radius:8px;height:38px;font-size:18px}
.blist{display:flex;flex-direction:column;gap:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.cols{grid-template-columns:1fr}.title h1{font-size:22px}}

/* big face overlay */
.burst{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;z-index:40;background:rgba(18,32,28,.35);cursor:pointer}
.burst.open{display:flex}
.burst .face{width:min(300px,60vw);height:min(300px,60vw);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.burst.bad .face{animation:shake .6s}
.burst .who{font-size:clamp(28px,5vw,48px);font-weight:900;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35);text-align:center}
.burst .what{font-family:var(--font-display),var(--font-body);font-size:clamp(24px,4vw,40px);font-weight:700;padding:6px 22px;border-radius:999px;background:#fff}
.burst.good .what{color:var(--good)}
.burst.bad .what{color:var(--bad)}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0)}}
@keyframes shake{0%{transform:scale(.4);opacity:0}30%{transform:scale(1)}45%{transform:translateX(-14px)}60%{transform:translateX(12px)}75%{transform:translateX(-8px)}90%{transform:translateX(4px)}100%{transform:none}}
.confetti{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:41;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 18px;display:none;align-items:center;gap:14px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.open{display:flex}
.toast button{border:0;background:var(--sun);color:#3a2a00;border-radius:8px;padding:6px 12px;font-weight:700}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div class="title">
    <div>
      <h1 id="className">四年級 班級加分板</h1>
      <div class="sub">點學生的頭像就能加分或扣分</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat total"><b id="sTotal">0</b><span>全班笑臉</span></div>
    <div class="stat g"><b id="sGood">0</b><span>今日笑臉</span></div>
    <div class="stat r"><b id="sBad">0</b><span>今日不高興</span></div>
  </div>
  <div class="spacer"></div>
  <div class="hbtns">
    <button class="hbtn primary" id="bClass">全班加分</button>
    <button class="hbtn" id="bRandom">隨機抽人</button>
    <button class="hbtn" id="bAdd">新增學生</button>
    <button class="hbtn" id="bSettings">設定</button>
  </div>
</header>

<div class="toolbar">
  <label for="sortSel">排列</label>
  <select id="sortSel">
    <option value="order">依座號</option>
    <option value="score">依分數高到低</option>
    <option value="name">依姓名</option>
  </select>
  <button class="tbtn" id="bSound" aria-pressed="true">音效：開</button>
  <span class="sync" id="sync">資料存在這台電腦的瀏覽器</span>
</div>

<div class="notice" id="demoNote" hidden>
  <span>目前是示範學生。按「新增學生」貼上全班名單，再清掉示範學生即可開始使用。</span>
  <button id="bClearDemo">清除示範學生</button>
</div>

<main><div class="grid" id="grid"></div></main>

<!-- student dialog -->
<div class="scrim" id="dStu" role="dialog" aria-modal="true" aria-labelledby="stuName">
  <div class="dlg">
    <div class="dlg-h">
      <div class="av" id="stuAv"></div>
      <div style="min-width:0;flex:1">
        <label for="stuName" class="hint">姓名（可直接修改）</label>
        <input class="nameedit" id="stuName">
      </div>
      <div class="bigpts" id="stuPts">0 分</div>
      <button class="x" data-close aria-label="關閉">×</button>
    </div>
    <div class="dlg-b">
      <div class="tabs">
        <button class="tab g on" id="tabG">加分</button>
        <button class="tab r" id="tabR">需要加油</button>
      </div>
      <div class="beh" id="behList"></div>
      <div class="sec">
        <h3>換一個動物頭像</h3>
        <div class="apicks" id="animalPick"></div>
      </div>
      <div class="sec">
        <h3>最近紀錄</h3>
        <ul class="log" id="stuLog"></ul>
      </div>
      <div class="row">
        <button class="btn" id="stuReset">這位學生分數歸零</button>
        <span class="spacer" style="flex:1"></span>
        <button class="btn danger" id="stuDel">刪除這位學生</button>
      </div>
    </div>
  </div>
</div>

<!-- class award dialog -->
<div class="scrim" id="dClass" role="dialog" aria-modal="true" aria-labelledby="classTitle">
  <div class="dlg">
    <div class="dlg-h"><h2 id="classTitle">全班一起</h2><button class="x" data-close aria-label="關閉">×</button></div>
    <div class="dlg-b">
      <div class="tabs">
        <button class="tab g on" id="ctabG">全班加分</button>
        <button class="tab r" id="ctabR">全班扣分</button>
      </div>
      <div class="beh" id="classBeh"></div>
    </div>
  </div>
</div>

<!-- add students dialog -->
<div class="scrim" id="dAdd" role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <div class="dlg">
    <div class="dlg-h"><h2 id="addTitle">新增學生</h2><button class="x" data-close aria-label="關閉">×</button></div>
    <div class="dlg-b">
      <label for="addText" class="hint">一行一個名字，也可以用頓號、逗號或空白隔開。可以直接從 Excel 名單複製貼上。</label>
      <textarea id="addText" placeholder="王小明&#10;陳美美&#10;林大同"></textarea>
      <div class="row"><button class="btn dark" id="addGo">加入名單</button><span class="hint" id="addMsg"></span></div>
    </div>
  </div>
</div>

<!-- settings dialog -->
<div class="scrim" id="dSet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="dlg">
    <div class="dlg-h"><h2 id="setTitle">設定</h2><button class="x" data-close aria-label="關閉">×</button></div>
    <div class="dlg-b">
      <div class="sec">
        <h3><label for="setClass">班級名稱</label></h3>
        <input class="inp" id="setClass">
      </div>
      <div class="cols">
        <div class="sec">
          <h3>加分項目</h3>
          <div class="blist" id="setPos"></div>
          <div class="row" style="margin-top:8px"><button class="btn" id="addPos">＋ 新增加分項目</button></div>
        </div>
        <div class="sec">
          <h3>需要加油項目（扣分）</h3>
          <div class="blist" id="setNeg"></div>
          <div class="row" style="margin-top:8px"><button class="btn" id="addNeg">＋ 新增扣分項目</button></div>
        </div>
      </div>
      <div class="sec">
        <h3>備份與還原</h3>
        <p class="hint">按「複製備份」後，貼到記事本存起來。要還原時，把備份文字貼進下方框框，再按「還原」。</p>
        <textarea id="backup" style="min-height:90px" placeholder="在這裡貼上備份文字"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="bCopy">複製備份</button>
          <button class="btn" id="bRestore">還原</button>
          <span class="hint" id="bkMsg"></span>
        </div>
      </div>
      <div class="sec">
        <h3>重新開始</h3>
        <div class="row">
          <button class="btn danger" id="bResetAll">全班分數歸零</button>
          <button class="btn danger" id="bDelAll">刪除全部學生</button>
          <span class="hint">按一次會詢問，再按一次才執行。</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="burst" id="burst" aria-live="polite">
  <div class="face" id="burstFace"></div>
  <div class="who" id="burstWho"></div>
  <div class="what" id="burstWhat"></div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo">復原</button></div>

<script>
(function(){
"use strict";
const LS_KEY = "class-points-board-v1";
const PALETTE = ["#ffd166","#9ad8ff","#ffb5c2","#b9e6a5","#d4bfff","#ffcf9e","#a7e8df","#f7c1f0","#c9d7ff","#e9e19a"];
const uid = () => Math.random().toString(36).slice(2,10);

function defaults(){
  return {
    className:"四年級 班級加分板",
    sort:"order",
    sound:true,
    demo:true,
    pos:[
      {id:uid(),label:"專心上課",pts:1},
      {id:uid(),label:"積極發言",pts:1},
      {id:uid(),label:"幫助同學",pts:1},
      {id:uid(),label:"認真完成作業",pts:1},
      {id:uid(),label:"團隊合作",pts:1},
      {id:uid(),label:"努力不放棄",pts:2}
    ],
    neg:[
      {id:uid(),label:"上課講話",pts:1},
      {id:uid(),label:"忘記帶作業",pts:1},
      {id:uid(),label:"不專心",pts:1},
      {id:uid(),label:"干擾同學",pts:1}
    ],
    students:["示範一號","示範二號","示範三號","示範四號","示範五號","示範六號"].map((n,i)=>mkStudent(n,i))
  };
}
const ANIMALS = ["cat","dog","rabbit","bear","panda","frog","fox","pig","chick","mouse","monkey","penguin","lion"];
const ANIMAL_NAMES = {cat:"貓咪",dog:"小狗",rabbit:"兔子",bear:"熊",panda:"熊貓",frog:"青蛙",fox:"狐狸",pig:"小豬",chick:"小雞",mouse:"老鼠",monkey:"猴子",penguin:"企鵝",lion:"獅子"};
function mkStudent(name,i){
  return {id:uid(),name:name,points:0,mood:null,color:PALETTE[i%PALETTE.length],animal:ANIMALS[i%ANIMALS.length],log:[]};
}
function migrate(){
  state.students.forEach((s,i)=>{ if(!s.animal || ANIMALS.indexOf(s.animal)<0) s.animal = ANIMALS[i%ANIMALS.length]; if(!s.color) s.color = PALETTE[i%PALETTE.length]; });
}

let state = null;
try { const raw = localStorage.getItem(LS_KEY); if(raw) state = JSON.parse(raw); } catch(e) {}
if(!state || !Array.isArray(state.students)) state = defaults();
migrate();

/* ---------- persistence ---------- */
let dbRef = null, writing = false, dirty = false, timer = null;
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
  if(dbRef){ dirty = true; clearTimeout(timer); timer = setTimeout(flush, 700); }
}
async function flush(){
  if(!dbRef || writing || !dirty) return;
  writing = true; dirty = false;
  try { await dbRef.set(JSON.parse(JSON.stringify(state))); setSync("已同步到你的帳號，換電腦也看得到"); }
  catch(e){ setSync("暫時無法同步，資料先存在這台電腦"); if(e && e.code==="invalid_argument"){ dbRef = null; } }
  writing = false;
  if(dirty) flush();
}
function setSync(t){ document.getElementById("sync").textContent = t; }
(async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    const user = await window.claude.use("user");
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.doc("data/users/"+id+"/dojo");
    const snap = await ref.get();
    if(snap.exists){
      const d = snap.data();
      if(d && Array.isArray(d.students)){ state = JSON.parse(JSON.stringify(d)); migrate(); try{localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(e){} render(); }
      dbRef = ref; setSync("已同步到你的帳號，換電腦也看得到");
    } else {
      dbRef = ref; dirty = true; flush();
    }
  }catch(e){ /* stay local */ }
})();

function shade(hex,amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

  const icon = n>0 ? MINI_SMILE : MINI_FROWN, k = Math.abs(n);

  return `${icon}<span class="times ${n>0?"g":"r"}">× ${k}</span>`;

/* ---------- sound ---------- */
let actx = null;
function beep(good){
  if(!state.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = good ? [523.25,659.25,783.99,1046.5] : [392,311.13];
    notes.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = good ? "triangle" : "sawtooth";
      o.frequency.value = f;
      const t = actx.currentTime + i*(good?0.09:0.22);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(good?0.25:0.12,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+(good?0.25:0.3));
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.35);
    });
  }catch(e){}
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function todayStart(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }

function render(){
  $("className").textContent = state.className;
  $("sortSel").value = state.sort;
  $("bSound").textContent = "音效：" + (state.sound ? "開" : "關");
  $("bSound").setAttribute("aria-pressed", state.sound ? "true" : "false");
  $("demoNote").hidden = !state.demo || state.students.length===0;

  let total=0, g=0, b=0; const t0=todayStart();
  state.students.forEach(s=>{ total+=s.points; s.log.forEach(l=>{ if(l.t>=t0){ if(l.v>0) g+=l.v; else b-=l.v; } }); });
  $("sTotal").textContent = total; $("sGood").textContent = g; $("sBad").textContent = b;

  const list = state.students.map((s,i)=>({s,i}));
  if(state.sort==="score") list.sort((a,b)=>b.s.points-a.s.points || a.i-b.i);
  if(state.sort==="name") list.sort((a,b)=>a.s.name.localeCompare(b.s.name,"zh-Hant"));
  const grid = $("grid");
  grid.innerHTML = list.map(({s,i})=>{
    const lbl = s.points>0 ? `${s.points} 個笑臉` : (s.points<0 ? `${-s.points} 個不高興的臉` : "還沒有笑臉");
    return `<button class="stu" data-id="${s.id}" aria-label="${esc(s.name)}，${lbl}"><span class="seat">${i+1}</span><span class="av">${animal(s.animal,s.color)}</span><span class="nm">${esc(s.name)}</span><span class="smiles">${faceRow(s.points)}</span></button>`;
  }).join("") + `<button class="stu addcard" id="addCard"><span class="plus">＋</span>新增學生</button>`;
}

/* ---------- awarding ---------- */
let undoInfo = null, toastTimer = null;
function award(list, v, label, who){
  const t = Date.now();
  const before = list.map(s=>({id:s.id, points:s.points, mood:s.mood, logLen:s.log.length}));
  list.forEach(s=>{
    s.points += v;
    s.mood = v>0 ? "happy" : "sad";
    s.log.unshift({t, v, label});
    if(s.log.length>40) s.log.length = 40;
  });
  save(); render();
  list.forEach(s=>{ const el=document.querySelector(`.stu[data-id="${s.id}"]`); if(el){ el.classList.add(v>0?"flash-good":"flash-bad"); } });
  showBurst(v>0, who, Math.abs(v), label);
  undoInfo = {before, v};
  showToast(v>0 ? `${who} 得到 ${v} 個笑臉：${label}` : `${who} 收到 ${-v} 個不高興的臉：${label}`);
}
function undo(){
  if(!undoInfo) return;
  undoInfo.before.forEach(b=>{
    const s = state.students.find(x=>x.id===b.id); if(!s) return;
    s.points = b.points; s.mood = b.mood;
    if(s.log.length>0 && s.log.length>=b.logLen) s.log.shift();
  });
  undoInfo = null; save(); render(); hideToast();
}
function showToast(msg){
  $("toastMsg").textContent = msg; $("toast").classList.add("open");
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $("toast").classList.remove("open"); }
$("toastUndo").onclick = undo;

let burstTimer = null;
function showBurst(good, who, n, label){
  const bu = $("burst");
  bu.classList.remove("good","bad"); void bu.offsetWidth;
  bu.classList.add(good?"good":"bad","open");
  const fc = $("burstFace"); fc.innerHTML = face(good?"happy":"sad", good ? "#ffd23f" : "#a9c9e8");
  fc.style.animation = "none"; void fc.offsetWidth; fc.style.animation = "";
  $("burstWho").textContent = who;
  $("burstWhat").innerHTML = `<span class="v">${(good?MINI_SMILE:MINI_FROWN).repeat(Math.min(n,5))}</span>${esc(label)}`;
  beep(good);
  if(good && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) confetti();
  clearTimeout(burstTimer); burstTimer = setTimeout(hideBurst, good?1900:2100);
}
function hideBurst(){ $("burst").classList.remove("open"); }
$("burst").onclick = hideBurst;
function confetti(){
  const cols = ["#f6b81c","#2a9a58","#59a9ec","#ff7f8f","#b48cff"];
  for(let i=0;i<40;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100+"vw";
    c.style.background = cols[i%cols.length];
    c.style.animationDuration = (1.2+Math.random()*1.2)+"s";
    c.style.animationDelay = (Math.random()*0.3)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2800);
  }
}

/* ---------- grid clicks ---------- */
$("grid").addEventListener("click",e=>{
  if(e.target.closest("#addCard")){ openAdd(); return; }
  const card = e.target.closest(".stu[data-id]"); if(card) openStudent(card.dataset.id);
});

/* ---------- class award ---------- */
let cTab = "g";
function fillClass(){
  $("ctabG").classList.toggle("on",cTab==="g"); $("ctabR").classList.toggle("on",cTab==="r");
  const items = cTab==="g"?state.pos:state.neg;
  $("classBeh").innerHTML = items.map(b=>`<button class="bbtn ${cTab}" data-b="${b.id}"><span class="v">${(cTab==="g"?MINI_SMILE:MINI_FROWN).repeat(b.pts)}</span>${esc(b.label)}</button>`).join("");
}
$("bClass").onclick=()=>{ if(!state.students.length){ openAdd(); return; } cTab="g"; fillClass(); openD("dClass"); };
$("ctabG").onclick=()=>{cTab="g";fillClass();};
$("ctabR").onclick=()=>{cTab="r";fillClass();};
$("classBeh").addEventListener("click",e=>{
  const btn=e.target.closest("[data-b]"); if(!btn) return;
  const items=cTab==="g"?state.pos:state.neg; const b=items.find(x=>x.id===btn.dataset.b); if(!b) return;
  award(state.students.slice(), cTab==="g"?b.pts:-b.pts, b.label, "全班");
  closeD("dClass");
});

/* ---------- random ---------- */
$("bRandom").onclick=()=>{
  const cards = [...document.querySelectorAll(".stu[data-id]")];
  if(!cards.length) return;
  let n = 0; const steps = 14 + Math.floor(Math.random()*cards.length);
  let last = null;
  const tick = ()=>{
    if(last) last.classList.remove("picked");
    last = cards[n % cards.length]; last.classList.add("picked");
    n++;
    if(n<steps) setTimeout(tick, 60 + n*12);
    else setTimeout(()=>{ last.classList.remove("picked"); openStudent(last.dataset.id); }, 650);
  };
  tick();
};

/* ---------- add students ---------- */
function openAdd(){ $("addText").value=""; $("addMsg").textContent=""; openD("dAdd"); setTimeout(()=>$("addText").focus(),50); }
$("bAdd").onclick = openAdd;
$("addGo").onclick=()=>{
  const names = $("addText").value.split(/[\n,，、;；\t]+|\s{1,}/).map(x=>x.trim()).filter(Boolean);
  if(!names.length){ $("addMsg").textContent="請先輸入至少一個名字。"; return; }
  const start = state.students.length;
  names.forEach((n,i)=>state.students.push(mkStudent(n,start+i)));
  save(); render();
  $("addMsg").textContent = `已加入 ${names.length} 位學生。`;
  $("addText").value="";
};

$("bClearDemo").onclick=()=>{
  state.students = state.students.filter(s=>!/^示範.號$/.test(s.name));
  state.demo = false; save(); render();
};

/* ---------- danger buttons (two-step) ---------- */
const dangerArmed = {};
function twoStep(btn, label, sureLabel, fn){
  btn.addEventListener("click",()=>{
    if(dangerArmed[btn.id]){ dangerArmed[btn.id]=false; btn.classList.remove("sure"); btn.textContent=label; fn(); }
    else { dangerArmed[btn.id]=true; btn.classList.add("sure"); btn.textContent=sureLabel;
      setTimeout(()=>{ if(dangerArmed[btn.id]){ dangerArmed[btn.id]=false; btn.classList.remove("sure"); btn.textContent=label; } },4000); }
  });
}
function resetDanger(){ ["stuDel","stuReset"].forEach(id=>{ dangerArmed[id]=false; $(id).classList.remove("sure"); }); $("stuDel").textContent="刪除這位學生"; $("stuReset").textContent="這位學生分數歸零"; }
twoStep($("stuDel"),"刪除這位學生","確定刪除？再按一次",()=>{
  state.students = state.students.filter(s=>s.id!==curId); save(); render(); closeD("dStu");
});
twoStep($("stuReset"),"這位學生分數歸零","確定歸零？再按一次",()=>{
  const s=cur(); if(!s) return; s.points=0; s.mood=null; s.log=[]; save(); render(); fillStudent();
});
twoStep($("bResetAll"),"全班分數歸零","確定全班歸零？再按一次",()=>{
  state.students.forEach(s=>{s.points=0;s.mood=null;s.log=[];}); save(); render();
});
twoStep($("bDelAll"),"刪除全部學生","確定全部刪除？再按一次",()=>{
  state.students=[]; state.demo=false; save(); render();
});

/* ---------- settings ---------- */
function behRows(kind){
  const items = state[kind];
  const el = $(kind==="pos"?"setPos":"setNeg");
  el.innerHTML = items.map((b,i)=>`<div class="brow" data-i="${i}">
    <input class="inp" aria-label="項目名稱" id="${kind}-l-${b.id}" value="${esc(b.label)}">
    <select aria-label="分數" id="${kind}-p-${b.id}">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===b.pts?"selected":""}>${kind==="pos"?"+":"−"}${n}</option>`).join("")}</select>
    <button class="del" aria-label="刪除項目" data-del="${b.id}">×</button></div>`).join("");
}
function openSettings(){
  $("setClass").value = state.className; behRows("pos"); behRows("neg");
  $("backup").value=""; $("bkMsg").textContent=""; openD("dSet");
}
$("bSettings").onclick = openSettings;
$("setClass").addEventListener("change",()=>{ const v=$("setClass").value.trim(); if(v){ state.className=v; save(); render(); } });
["pos","neg"].forEach(kind=>{
  const el = $(kind==="pos"?"setPos":"setNeg");
  el.addEventListener("change",e=>{
    const m = e.target.id.match(/^(pos|neg)-(l|p)-(.+)$/); if(!m) return;
    const b = state[kind].find(x=>x.id===m[3]); if(!b) return;
    if(m[2]==="l"){ const v=e.target.value.trim(); if(v) b.label=v; }
    else b.pts = parseInt(e.target.value,10)||1;
    save();
  });
  el.addEventListener("click",e=>{
    const d = e.target.closest("[data-del]"); if(!d) return;
    state[kind] = state[kind].filter(x=>x.id!==d.dataset.del); save(); behRows(kind);
  });
});
$("addPos").onclick=()=>{ state.pos.push({id:uid(),label:"新的加分項目",pts:1}); save(); behRows("pos"); };
$("addNeg").onclick=()=>{ state.neg.push({id:uid(),label:"新的扣分項目",pts:1}); save(); behRows("neg"); };
$("bCopy").onclick=async()=>{
  const txt = JSON.stringify(state);
  $("backup").value = txt;
  try{ await navigator.clipboard.writeText(txt); $("bkMsg").textContent="已複製，請貼到記事本保存。"; }
  catch(e){ $("backup").select(); $("bkMsg").textContent="無法自動複製，請按 Ctrl+C 複製框內文字。"; }
};
$("bRestore").onclick=()=>{
  try{
    const d = JSON.parse($("backup").value);
    if(!d || !Array.isArray(d.students) || !Array.isArray(d.pos) || !Array.isArray(d.neg)) throw 0;
    state = d; save(); render(); $("setClass").value=state.className; behRows("pos"); behRows("neg");
    $("bkMsg").textContent = `已還原 ${state.students.length} 位學生。`;
  }catch(e){ $("bkMsg").textContent="這段文字不是有效的備份，請確認有完整複製。"; }
};

/* ---------- toolbar ---------- */
$("sortSel").onchange=()=>{ state.sort=$("sortSel").value; save(); render(); };
$("bSound").onclick=()=>{ state.sound=!state.sound; save(); render(); };

render();
})();
</script>
</body>
</html>
